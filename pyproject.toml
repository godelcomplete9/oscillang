[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscillang"
version = "0.1.0"
description = "Oscillator-gated agent nervous system: a cheap decision model (Jev) gates behavioral fragments for a generative LLM (Main Brain)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "oscillang" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["oscillang*"]

[tool.setuptools.package-data]
oscillang = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
